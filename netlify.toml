[build]
  command = "npm --prefix latam-org ci && npm --prefix latam-org run build"
  publish = "latam-org/dist"
  functions = "latam-org/netlify/functions"

[dev]
  command = "npm --prefix latam-org run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
